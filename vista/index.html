<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horarios Real-Time</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/vista.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Panel de Horarios</h1>
            <div id="current-time">00:00:00</div>

            <div class="controls-wrapper">
                <div class="search-box">
                    <input type="text" id="busqueda-personal" placeholder="Buscar persona...">
                </div>
                <div class="controls">
                    <label>JORNADA</label>
                    <input type="date" id="fecha-selector">
                </div>
            </div>
        </div>

        <div id="status-message">Conectando...</div>

        <div id="horario-wrapper" style="display: none;">
            <div class="horario-nav">
                <button id="btn-prev" class="nav-button">Anterior</button>
                <span id="info-horarios"></span>
                <button id="btn-next" class="nav-button">Siguiente</button>
            </div>
            <div id="horario-container" class="horario-tabla-container"></div>
        </div>

        <footer>CarlosPN Interactive® — Mobile BI Interface</footer>
    </div>

    <script src="../js/shared.js"></script>
    <script src="../js/vista.js"></script>
</body>
</html>
